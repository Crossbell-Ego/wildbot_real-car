services:
  kros_car:
    image: wildbot_workspace:latest
    privileged: true
    device_cgroup_rules:
      - 'c 13:* rwm'
    env_file:
      - .env
    volumes:
      - /dev/usb_wheel:/dev/usb_wheel
      - /dev/usb_robot_arm:/dev/usb_robot_arm
      - /dev/imu_a9:/dev/imu_a9
      - /dev/usb_lidar:/dev/usb_lidar
      - ./configs:/configs:ro
      - /dev/input:/dev/input
      - /home/robot/桌面/wildbot_photos:/photos
      - /home/robot/wildbot_real car/wildbot_workspace-main:/workspaces
      - /home/robot/wildbot_real car/wildbot_workspace-main/workspaces/kros_car_persistent.xacro:/robot_ws/src/wildbot-car-description/urdf/kros_car.xacro
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    networks:
      - my_bridge_network
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
                ros2 launch kros_car bringup.launch.py"

