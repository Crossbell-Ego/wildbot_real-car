  imu_driver:
    image: wildbot_workspace:latest
    privileged: true
    volumes:
      - /dev/imu_a9:/dev/imu_a9
      - /home/robot/wildbot_real car/wildbot_workspace-main:/workspaces
    networks:
      - my_bridge_network
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
                source /workspaces/workspaces/imu_ws/install/setup.bash &&
                ros2 run handsfree_imu_ros2 imu_a9_data_node --ros-args -p port:=/dev/imu_a9 -p baud:=921600"

  localization_ekf:
    image: wildbot_workspace:latest
    volumes:
      - /home/robot/wildbot_real car/wildbot_workspace-main:/workspaces
    networks:
      - my_bridge_network
    depends_on:
      - kros_car
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
                source /workspaces/install/setup.bash &&
                ros2 launch wildbot_localization ekf_launch.py"

networks:
  my_bridge_network:
    driver: bridge